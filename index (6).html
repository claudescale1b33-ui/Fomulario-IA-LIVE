<style>
  :root{
    --teal:#39B59D;
    --teal-dark:#2C8F7D;
    --teal-tint:#E6F5F2;
    --ink:#101111;
    --ink-2:#2B2C2C;
    --bg:#F5F7F7;
    --card:#FFFFFF;
    --text:#1C1C1C;
    --muted:#6B7280;
    --line:#E3E7E7;
    --err:#B4453A;
    --err-tint:#F6E5E2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    position:relative;
    background:var(--bg);
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    overflow-x:hidden;
  }
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .ambient span{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.5;}
  .ambient span:nth-child(1){width:380px;height:380px;top:-140px;left:-100px;background:rgba(57,181,157,0.16);animation:float1 22s ease-in-out infinite;}
  .ambient span:nth-child(2){width:320px;height:320px;bottom:-120px;right:-100px;background:rgba(16,17,17,0.05);animation:float2 26s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,40px) scale(1.08);}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-30px) scale(1.06);}}
  .brand, .shell{position:relative; z-index:1;}

  .brand{display:flex;align-items:center;justify-content:center;margin-bottom:26px;}
  .brand img{height:34px;display:block;}

  .shell{width:100%;max-width:420px;}

  .intro{color:var(--ink);text-align:center;margin-bottom:24px;}
  .intro h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    font-size:clamp(22px,5vw,28px);
    line-height:1.25;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .intro p{font-size:14px;color:var(--muted);line-height:1.55;margin:0;}

  .card{
    background:var(--card);
    border-radius:14px;
    padding:30px 28px 28px;
    box-shadow:0 24px 48px -20px rgba(16,17,17,0.14);
    border:1px solid var(--line);
  }

  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink-2);
  }
  .field input{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:12px 13px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--text);
    background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  .focus-frame{position:relative;border-radius:10px;}
  .focus-frame::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:10px;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s ease, inset .25s ease;
    background:
      linear-gradient(var(--teal),var(--teal)) top left / 12px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) top left / 2px 12px no-repeat,
      linear-gradient(var(--teal),var(--teal)) top right / 12px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) top right / 2px 12px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom left / 12px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom left / 2px 12px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom right / 12px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom right / 2px 12px no-repeat;
  }
  .focus-frame:focus-within::after{opacity:1;inset:-5px;}
  .field input:focus{outline:none;}
  .error-msg{color:var(--err);font-size:12.5px;margin-top:6px;display:none;}
  .field.invalid input{border-color:var(--err);}
  .field.invalid .error-msg{display:block;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:8px;
    padding:13px 26px;
    cursor:pointer;
    width:100%;
    transition:transform .15s, background .15s, box-shadow .2s;
    position:relative;
    overflow:hidden;
  }
  button:active{transform:scale(0.99);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.3), transparent);
    transform:skewX(-20deg);
    transition:left .5s ease;
  }
  .btn-primary:hover{background:var(--teal-dark);box-shadow:0 10px 22px -8px rgba(44,143,125,0.5);}
  .btn-primary:hover::before{left:130%;}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

  .status-screen{text-align:center;padding:8px 4px 4px;}
  .status-screen .icon{
    width:56px;height:56px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
  }
  .status-screen.success .icon{background:var(--teal-tint);color:var(--teal-dark);animation:popIn .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes popIn{0%{transform:scale(0.4);opacity:0;}70%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
  .status-screen.success .icon svg{width:26px;height:26px;}
  .status-screen.success .icon svg path{
    stroke:var(--teal-dark);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .45s ease .35s forwards;
  }
  @keyframes drawCheck{to{stroke-dashoffset:0;}}
  .status-screen.error .icon{background:var(--err-tint);color:var(--err);}
  .status-screen h2{margin:0 0 6px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .status-screen p{color:var(--muted);font-size:14px;line-height:1.55;margin:0;}
  .spinner{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--teal);
    animation:spin 0.8s linear infinite;margin:6px auto 0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:420px){
    .card{padding:24px 20px 22px;border-radius:10px;}
    .field input{font-size:16px;}
  }
</style>
</head>

    <div class="intro" id="introBlock">
      <h1>Fala com a gente!</h1>
      <p>Preenche rapidinho e te chamamos no WhatsApp.</p>
    </div>

    <div class="card" id="card">
      <!-- injected by JS -->
    </div>
  </div>

<script>
// Cole aqui a URL do seu Google Apps Script (termina em /exec)
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxi3I35T1Xur3eDNfFEaKhHPWJWXIyflKG3cOof-58QsnjwmZMslAE7evjPp6D0vYRnRw/exec";

const FIELDS = [
  {id:"nome_otica", label:"Nome da Ótica", type:"text", required:true},
  {id:"nome_respondente", label:"Seu nome", type:"text", required:true},
  {id:"whatsapp", label:"Número com DDD (WhatsApp)", type:"tel", required:true}
];

const answers = {};
const card = document.getElementById('card');
const introBlock = document.getElementById('introBlock');

function maskPhone(value){
  let d = value.replace(/\D/g,'').slice(0,11);
  if(d.length <= 2) return d.length ? `(${d}` : '';
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

function fieldHTML(f){
  return `
    <div class="field ${f.required ? 'required':''}" data-field="${f.id}">
      <label for="${f.id}">${f.label}</label>
      <div class="focus-frame"><input type="${f.type}" id="${f.id}" autocomplete="off"></div>
      <div class="error-msg">Esse campo é obrigatório.</div>
    </div>`;
}

function render(){
  card.innerHTML = FIELDS.map(fieldHTML).join('') +
    `<button class="btn-primary" id="submitBtn">Enviar</button>`;

  const whatsappEl = document.getElementById('whatsapp');
  whatsappEl.addEventListener('input', ()=>{
    whatsappEl.value = maskPhone(whatsappEl.value);
  });

  document.getElementById('submitBtn').addEventListener('click', handleSubmit);
}

function collect(){
  let valid = true;
  FIELDS.forEach(f=>{
    const fieldEl = document.querySelector(`[data-field="${f.id}"]`);
    const value = document.getElementById(f.id).value.trim();
    answers[f.id] = value;
    if(f.required && !value){
      valid = false;
      fieldEl.classList.add('invalid');
    } else {
      fieldEl.classList.remove('invalid');
    }
  });
  return valid;
}

function handleSubmit(){
  if(!collect()) return;
  submitForm();
}

async function submitForm(){
  introBlock.style.display = 'none';
  card.innerHTML = `
    <div class="status-screen">
      <div class="spinner"></div>
      <h2 style="margin-top:14px;">Enviando…</h2>
      <p>Só um instante.</p>
    </div>`;

  try{
    if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.indexOf('COLE_AQUI') !== -1){
      throw new Error('missing_url');
    }

    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      // text/plain evita complicações de CORS com o Apps Script
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        nomeOtica: answers['nome_otica'],
        nomeRespondente: answers['nome_respondente'],
        whatsapp: answers['whatsapp']
      })
    });

    card.innerHTML = `
      <div class="status-screen success">
        <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></div>
        <h2>Recebemos!</h2>
        <p>Obrigado, ${escapeHtml(answers['nome_respondente'])}. Já vamos te chamar no WhatsApp.</p>
      </div>`;
  } catch(err){
    card.innerHTML = `
      <div class="status-screen error">
        <div class="icon">!</div>
        <h2>Não conseguimos enviar</h2>
        <p>Tente novamente em alguns instantes.</p>
        <button class="btn-primary" style="margin-top:16px;" onclick="location.reload()">Tentar novamente</button>
      </div>`;
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
